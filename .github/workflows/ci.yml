name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and run React ESLint checks
        env:
          CI: 'true'
        run: npm run build
      - name: Run tests if test files exist
        shell: bash
        run: |
          if find src -type f \( -name '*.test.js' -o -name '*.spec.js' -o -name '*.test.jsx' -o -name '*.spec.jsx' \) | grep -q .; then
            CI=true npm test -- --watch=false --passWithNoTests
          else
            echo 'No test files found; skipping test execution.'
          fi
